spring.application.name=smart-complaint-backend

spring.datasource.url=jdbc:mysql://localhost:3306/smart_complaint_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Apache Spark Analytics CSV File
spark.analytics.file=F:/smart_complaint_system/big-data/output/mysql_category_analytics/category_analytics.csv